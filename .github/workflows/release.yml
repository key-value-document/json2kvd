# Publish json2kvd to crates.io on tagged releases.
# Requires kvd-rs 1.0.0 to already be published.

name: release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: rust:1-trixie
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Publish json2kvd
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
